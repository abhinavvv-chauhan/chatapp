            </div>
        `;
    }

    function addPollOption() {
        const container = document.getElementById('poll-options-container');
        const currentCount = container.querySelectorAll('.poll-opt-input').length;
        
        if (currentCount >= 10) return alert("Maximum 10 options allowed.");

        const div = document.createElement('div');
        div.className = 'poll-option-wrapper';
        div.style.display = 'flex';
        div.style.gap = '8px';
        
        // Notice we add a Red 'X' button so they can delete the extra options!
        div.innerHTML = `
            <input class="poll-opt-input" placeholder="Option ${currentCount + 1}" style="flex: 1; padding: 14px; background: #0f172a; border: 1px solid #334155; color: white; border-radius: 8px; outline: none; font-size: 15px; box-sizing: border-box;">
            <button onclick="this.parentElement.remove()" style="background: #334155; border: none; color: #ef4444; width: 48px; border-radius: 8px; cursor: pointer; font-size: 20px; display: flex; align-items: center; justify-content: center;" title="Remove option">&times;</button>
        `;
        container.appendChild(div);
    }

    async function sendPoll() {
        const q = document.getElementById('poll-q').value.trim();
        
        // 1. Grab EVERY input field dynamically
        const optionInputs = document.querySelectorAll('.poll-opt-input');
        
        // 2. Extract their values, and filter out any empty ones!
        const options = Array.from(optionInputs)
            .map(input => input.value.trim())
            .filter(val => val !== '');

        // 3. Validation
        if (!q) return alert("Please enter a question.");
        if (options.length < 2) return alert("Please provide at least 2 valid options.");

        // 4. Send the dynamic array to your Go Backend!
        try {
            const res = await fetch('/api/v1/polls', {
                method: 'POST',
                headers: {'Authorization': `Bearer ${activeToken}`, 'Content-Type': 'application/json'},
                body: JSON.stringify({question: q, options: options})
            });
            
            if (!res.ok) throw new Error("Failed to create poll");
            const data = await res.json();

            // Broadcast the Poll ID to everyone in the channel
            ws.send(`[POLL=${data.id}]${q}`);
            closePollModal();

        } catch (err) {
            alert(err.message);
        }
    }

    async function fetchAndRenderPoll(pollId) {
        const res = await fetch(`/api/v1/polls/${pollId}`, {headers:{'Authorization': `Bearer ${activeToken}`}});
        const poll = await res.json();
        const div = document.getElementById(`poll-${pollId}`);
        if (!div) return;

        let html = `<div style="font-weight: bold; color: white; margin-bottom: 15px; font-size: 15px;">📊 ${escHtml(poll.question)}</div>`;

        poll.options.forEach(opt => {
            const percent = poll.total_votes > 0 ? Math.round((opt.votes / poll.total_votes) * 100) : 0;
            const bg = opt.has_voted ? '#0ea5e9' : '#334155'; // Highlight blue if voted
            html += `
                <div onclick="votePoll('${pollId}', '${opt.id}')" style="background: ${bg}; padding: 10px 14px; border-radius: 6px; margin-bottom: 8px; cursor: pointer; position: relative; overflow: hidden; border: 1px solid #475569; transition: 0.2s;">
                    <div style="position: absolute; top: 0; left: 0; bottom: 0; width: ${percent}%; background: rgba(255,255,255,0.15); z-index: 1;"></div>
                    <div style="display: flex; justify-content: space-between; position: relative; z-index: 2; font-size: 14px;">
                        <span style="color: white; font-weight: 500;">${escHtml(opt.text)}</span>
                        <span style="color: #cbd5e1; font-weight: bold;">${percent}%</span>
                    </div>
                </div>
            `;
        });
        html += `<div style="font-size: 11px; color: #94a3b8; margin-top: 8px; text-align: right;">${poll.total_votes} votes</div>`;
        div.innerHTML = html;
    }

    async function votePoll(pollId, optionId) {
        await fetch(`/api/v1/polls/${pollId}/vote`, {
            method: 'POST',
            headers: {'Authorization': `Bearer ${activeToken}`, 'Content-Type': 'application/json'},
            body: JSON.stringify({option_id: optionId})
        });
        // 1. Instantly update UI for the clicker
        fetchAndRenderPoll(pollId); 
        // 2. Tell everyone else in the WebSocket to silently re-fetch their UI!
        ws.send(`[POLL_UPDATE=${pollId}]`);
    }
